name: Build FeeTrack with P4A
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      ANDROIDSDK: /usr/local/lib/android/sdk
      ANDROIDNDK: /usr/local/lib/android/sdk/ndk/21.4.7075529

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: 'temurin', java-version: '17'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y git zip unzip wget lib32stdc++6 lib32z1
          pip install --upgrade pip cython

      - name: Install Android SDK + NDK
        run: |
          mkdir -p $ANDROIDSDK/cmdline-tools
          cd $ANDROIDSDK/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip && mv cmdline-tools latest
          mkdir -p $ANDROIDSDK/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROIDSDK/licenses/android-sdk-license
          export PATH="$ANDROIDSDK/cmdline-tools/latest/bin:$PATH"
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;21.4.7075529"
          yes | sdkmanager --licenses

      - name: Install python-for-android
        run: pip install https://github.com/kivy/python-for-android/archive/develop.zip

      - name: Build APK
        run: |
          export PATH="$ANDROIDSDK/cmdline-tools/latest/bin:$ANDROIDSDK/platform-tools:$PATH"
          p4a apk --private . --package=com.josephmbui.feetrackacademy --name "FeeTrack" --version 1.0.1 --bootstrap sdl2 --requirements=python3,kivy==2.3.0,pillow,reportlab,requests,filetype,certifi --arch arm64-v8a --ndk-version=21.4.7075529 --sdk-path $ANDROIDSDK --ndk-path $ANDROIDNDK --android-api 33 --android-min-api 21 --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with: {name: FeeTrack-APK, path: bin/*.apk}
