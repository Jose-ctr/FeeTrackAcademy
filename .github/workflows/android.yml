name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip wget curl autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake \
            libffi-dev libssl-dev build-essential

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;34.0.0" \
            "ndk;28.0.13004108" \
            "cmdline-tools;latest"

      - name: Set Android environment variables
        run: |
          echo "ANDROIDSDK=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROIDNDK=$ANDROID_SDK_ROOT/ndk/28.0.13004108" >> $GITHUB_ENV
          echo "P4A_SDK_DIR=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "P4A_NDK_DIR=$ANDROID_SDK_ROOT/ndk/28.0.13004108" >> $GITHUB_ENV

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer==1.5.0 cython==0.29.36 virtualenv

      - name: Verify project files
        run: |
          ls -la
          test -f buildozer.spec
          test -f main.py

      - name: Clear old builds
        run: |
          rm -rf .buildozer
          rm -rf ~/.buildozer

      - name: Build with Buildozer
        env:
          ANDROIDSDK: ${{ env.ANDROIDSDK }}
          ANDROIDNDK: ${{ env.ANDROIDNDK }}
          P4A_SDK_DIR: ${{ env.P4A_SDK_DIR }}
          P4A_NDK_DIR: ${{ env.P4A_NDK_DIR }}
        run: |
          buildozer -v android debug

      - name: Find APK files
        if: always()
        run: |
          echo "Searching for APK files..."
          find . -name "*.apk" | sort || true

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FeeTrack-debug-apk
          path: |
            bin/*.apk
            .buildozer/bin/*.apk
            .buildozer/android/platform/build-*/dists/*/build/outputs/apk/debug/*.apk
            .buildozer/android/platform/build-*/dists/*/bin/*.apk
          if-no-files-found: error
