name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Python 3.11 (compatible with Kivy 2.3.0)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Java 17
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Linux build dependencies
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake \
            libffi-dev libssl-dev build-essential

      # Buildozer + Cython
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer==1.5.0 cython==0.29.33 virtualenv

      # Install Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Install packages that contain AIDL
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "cmdline-tools;latest"

      # Verify AIDL exists
      - name: Verify AIDL
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          find $ANDROID_SDK_ROOT -name aidl | head

      # Verify project files
      - name: Verify project files
        run: |
          ls -la
          test -f buildozer.spec
          test -f main.py
