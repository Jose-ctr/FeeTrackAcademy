name: Android Build
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      ANDROID_NDK_HOME: ${{ github.workspace }}/android-ndk-r27c

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip curl autoconf automake libtool pkg-config zlib1g-dev libncurses6 libncurses-dev libtinfo6 libffi-dev libssl-dev libsqlite3-dev build-essential cmake

      - name: Download Android NDK r27c
        run: |
          set -euo pipefail
          cd ${{ github.workspace }}
          curl -fSL --retry 3 --retry-delay 5 -o ndk.zip "https://dl.google.com/android/repository/android-ndk-r27c-linux.zip"
          unzip -q ndk.zip
          rm ndk.zip

      - name: Setup Android SDK
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_SDK_ROOT"
          cd /tmp
          curl -fSL --retry 3 --retry-delay 5 -o cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q cmdline-tools.zip
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          mv cmdline-tools "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          rm cmdline-tools.zip
          
          # Force accept ALL licenses to bypass prompt
          mkdir -p "$ANDROID
