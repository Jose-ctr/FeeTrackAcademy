name: Build FeeTrack APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk
          pip install buildozer cython
      - name: Build SDK and Accept Licenses
        run: |
          buildozer android debug --no-cache || true
          mkdir -p /home/runner/.buildozer/android/platform/android-sdk/licenses
          echo "8933bad161af4178b1185d1a37c4e3d9edafba9b" > /home/runner/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          /home/runner/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.2" "platforms;android-33" --sdk_root=/home/runner/.buildozer/android/platform/android-sdk
      - name: Build APK
        run: buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FeeTrack-APK
          path: bin/*.apk
