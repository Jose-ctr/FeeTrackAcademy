name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip wget openjdk-17-jdk \
            python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses6 libncurses-dev libtinfo6

      - name: Verify Git
        run: |
          which git
          git --version

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.36

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "ndk;28.0.13004108"

      - name: Verify AIDL
        run: |
          find $ANDROID_SDK_ROOT -name aidl
          $ANDROID_SDK_ROOT/build-tools/33.0.2/aidl --version || true

      - name: Clean build cache
        run: rm -rf .buildozer

      - name: Build APK
        env:
          PATH: /usr/bin:/bin:/usr/local/bin:${{ env.PATH }}
          ANDROIDAPI: 33
          ANDROIDMINAPI: 30
        run: |
          echo "PATH=$PATH"
          which git
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FeeTrack-APK
          path: bin/*.apk
