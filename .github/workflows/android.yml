name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      ANDROID_HOME: ${{ github.workspace }}/android-sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl wget git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake \
            libffi-dev libssl-dev build-essential python3-pip \
            python3-setuptools libgl1-mesa-dev

      - name: Cache Buildozer directory
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('**/buildozer.spec') }}

      - name: Configure Android SDK variables and PATH
        run: |
          mkdir -p "$ANDROID_SDK_ROOT"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH

      - name: Install Android commandline tools and SDK packages
        env:
          ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
        run: |
          set -euo pipefail

          export JAVA_HOME="${JAVA_HOME:-/usr/lib/jvm/java-17-openjdk-amd64}"
          echo "Using JAVA_HOME=$JAVA_HOME"

          cd "$ANDROID_SDK_ROOT"

          CLI_ZIP=commandlinetools-linux-9477386_latest.zip

          if [ ! -f "$CLI_ZIP" ]; then
            echo "Downloading Android command line tools..."
            wget -q https://dl.google.com/android/repository/$CLI_ZIP
          fi

          mkdir -p cmdline-tools
          unzip -q -o "$CLI_ZIP" -d cmdline-tools/tmp

          if [ -d cmdline-tools/tmp/cmdline-tools ]; then
            rm -rf cmdline-tools/latest || true
            mv cmdline-tools/tmp/cmdline-tools cmdline-tools/latest
          else
            rm -rf cmdline-tools/latest || true
            mv cmdline-tools/tmp cmdline-tools/latest
          fi

          rm -rf cmdline-tools/tmp

          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"

          echo "Accepting Android licenses..."
          set +o pipefail
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses || true
          set -o pipefail

          packages=(
            "platform-tools"
            "platforms;android-33"
            "build-tools;33.0.2"
            "ndk;23.1.7779620"
            "cmake;3.22.1"
          )

          for pkg in "${packages[@]}"; do
            echo "Installing $pkg"
            for attempt in 1 2 3; do
              sdkmanager --sdk_root="$ANDROID_SDK_ROOT" "$pkg" && break
              echo "Retry $attempt for $pkg"
              sleep 10
            done
          done

          test -d "$ANDROID_SDK_ROOT/platforms/android-33"

      - name: Install Buildozer and Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer==1.5.0 cython==0.29.33 virtualenv

      - name: Check buildozer.spec exists
        run: |
          if [ ! -f buildozer.spec ]; then
            echo "::error::buildozer.spec not found in repository root"
            ls -la
            exit 1
          fi
          echo "Found buildozer.spec"

      - name: Build APK
        env:
          ANDROIDSDK: ${{ github.workspace }}/android-sdk
          ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
          ANDROID_HOME: ${{ github.workspace }}/android-sdk
        run: |
          set -o pipefail
          buildozer android clean || true
          yes | buildozer -v android debug 2>&1 | tee buildozer-output.txt

      - name: Show build files
        if: always()
        run: |
          echo "=== bin ==="
          ls -lah bin || true
          echo "=== dist ==="
          ls -lah dist || true
          echo "=== APK files ==="
          find . -type f -name "*.apk" -ls || true

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FeeTrack-APK
          path: |
            bin/*.apk
            dist/*.apk
            ./.buildozer/android/platform/build/dists/**/*.apk
            **/*.apk
          if-no-files-found: warn

      - name: Upload Buildozer log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: buildozer-output.txt
