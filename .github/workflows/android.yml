name: Build FeeTrack APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. PYTHON
      # ==========================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ==========================================
      # 3. JAVA
      # ==========================================
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # 4. SYSTEM DEPENDENCIES
      # ==========================================
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            build-essential \
            libssl-dev \
            zlib1g-dev \
            libncurses6 \
            libncurses-dev \
            libtinfo6


      # ==========================================
      # 5. INSTALL BUILDOZER
      # ==========================================
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip

          python -m pip install buildozer

          python -m pip install \
            "cython==0.29.37"


      # ==========================================
      # 6. VERIFY PROJECT
      # ==========================================
      - name: Verify project files
        run: |
          echo "=========================================="
          echo "CURRENT DIRECTORY"
          echo "=========================================="

          pwd

          echo ""
          echo "=========================================="
          echo "PROJECT FILES"
          echo "=========================================="

          ls -la

          echo ""
          echo "=========================================="
          echo "BUILDOZER SPEC"
          echo "=========================================="

          test -f buildozer.spec

          cat buildozer.spec

          echo ""
          echo "=========================================="
          echo "MAIN.PY"
          echo "=========================================="

          test -f main.py

          ls -lh main.py


      # ==========================================
      # 7. CLEAN OLD BUILDS
      # ==========================================
      - name: Clean Buildozer
        run: |
          rm -rf .buildozer
          rm -rf ~/.buildozer
          rm -rf bin


      # ==========================================
      # 8. PREPARE ANDROID SDK
      # ==========================================
      - name: Prepare Android SDK
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK"

          echo "SDK:"
          echo "$SDK"


      # ==========================================
      # 9. INSTALL ANDROID COMMAND LINE TOOLS
      # ==========================================
      - name: Install Android command line tools
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK/cmdline-tools"

          cd "$SDK"

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip \
            -O commandlinetools.zip

          rm -rf "$SDK/cmdline-tools/temp"

          mkdir -p "$SDK/cmdline-tools/temp"

          unzip -q \
            commandlinetools.zip \
            -d "$SDK/cmdline-tools/temp"

          mkdir -p "$SDK/cmdline-tools/latest"

          cp -R \
            "$SDK/cmdline-tools/temp/cmdline-tools/"* \
            "$SDK/cmdline-tools/latest/"

          rm -rf "$SDK/cmdline-tools/temp"

          rm -f "$SDK/commandlinetools.zip"

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          echo "$SDK/tools/bin" >> "$GITHUB_PATH"

          echo "===== SDKMANAGER ====="

          ls -lh \
            "$SDK/cmdline-tools/latest/bin/sdkmanager"


      # ==========================================
      # 10. CREATE LEGACY SDKMANAGER PATH
      # ==========================================
      - name: Create sdkmanager compatibility path
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK/tools/bin"

          ln -sf \
            "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK/tools/bin/sdkmanager"

          echo "===== LEGACY SDKMANAGER ====="

          ls -lh \
            "$SDK/tools/bin/sdkmanager"


      # ==========================================
      # 11. VERIFY SDKMANAGER
      # ==========================================
      - name: Verify sdkmanager
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          export PATH="$SDK/tools/bin:$SDK/cmdline-tools/latest/bin:$PATH"

          "$SDK/tools/bin/sdkmanager" --version


      # ==========================================
      # 12. ACCEPT ANDROID LICENSES
      # ==========================================
      - name: Accept Android licenses
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          export PATH="$SDK/tools/bin:$SDK/cmdline-tools/latest/bin:$PATH"

          yes | "$SDK/tools/bin/sdkmanager" --licenses || true


      # ==========================================
      # 13. INSTALL ANDROID PACKAGES
      # ==========================================
      - name: Install Android packages
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          export PATH="$SDK/tools/bin:$SDK/cmdline-tools/latest/bin:$PATH"

          "$SDK/tools/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;34.0.0" \
            "ndk;28.0.13004108"

          yes | "$SDK/tools/bin/sdkmanager" --licenses || true


      # ==========================================
      # 14. VERIFY AIDL
      # ==========================================
      - name: Verify AIDL
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "=========================================="
          echo "BUILD TOOLS"
          echo "=========================================="

          ls -la "$SDK/build-tools"

          echo ""
          echo "=========================================="
          echo "AIDL"
          echo "=========================================="

          find "$SDK/build-tools" \
            -type f \
            -name "aidl" \
            -print

          test -f \
            "$SDK/build-tools/34.0.0/aidl"


      # ==========================================
      # 15. BUILD APK
      # ==========================================
      - name: Build APK
        env:
          ANDROID_HOME: ${{ env.HOME }}/.buildozer/android/platform/android-sdk
          ANDROID_SDK_ROOT: ${{ env.HOME }}/.buildozer/android/platform/android-sdk
          ANDROIDSDK: ${{ env.HOME }}/.buildozer/android/platform/android-sdk

          ANDROIDNDK: ${{ env.HOME }}/.buildozer/android/platform/android-sdk/ndk/28.0.13004108
          ANDROID_NDK_HOME: ${{ env.HOME }}/.buildozer/android/platform/android-sdk/ndk/28.0.13004108
          ANDROID_NDK_ROOT: ${{ env.HOME }}/.buildozer/android/platform/android-sdk/ndk/28.0.13004108

          P4A_SDK_DIR: ${{ env.HOME }}/.buildozer/android/platform/android-sdk
          P4A_NDK_DIR: ${{ env.HOME }}/.buildozer/android/platform/android-sdk/ndk/28.0.13004108

        run: |
          set -o pipefail

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          export PATH="$SDK/tools/bin:$SDK/cmdline-tools/latest/bin:$PATH"

          echo "=========================================="
          echo "BUILD ENVIRONMENT"
          echo "=========================================="

          echo "Python:"
          python --version

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "SDK:"
          echo "$ANDROID_SDK_ROOT"

          echo ""
          echo "SDKMANAGER:"
          "$SDK/tools/bin/sdkmanager" --version

          echo ""
          echo "AIDL:"
          ls -lh "$SDK/build-tools/34.0.0/aidl"

          echo ""
          echo "=========================================="
          echo "STARTING BUILDOZER"
          echo "=========================================="

          echo "Full Buildozer log is being saved to build.log"

          buildozer -v android debug \
            --storage-dir=.buildozer \
            2>&1 | tee build.log


      # ==========================================
      # 16. SHOW LAST PART OF LOG
      # ==========================================
      - name: Show build log summary
        if: always()
        run: |
          echo "=========================================="
          echo "LAST 150 LINES OF BUILD LOG"
          echo "=========================================="

          if [ -f build.log ]; then
            tail -n 150 build.log
          else
            echo "build.log was not created."
          fi


      # ==========================================
      # 17. FIND ERRORS
      # ==========================================
      - name: Find build errors
        if: always()
        run: |
          echo "=========================================="
          echo "ERROR SUMMARY"
          echo "=========================================="

          if [ -f build.log ]; then

            grep -i \
              -E "error|exception|failed|command failed|traceback" \
              build.log \
              | tail -n 100 \
              || true

          else

            echo "No build.log found."

          fi


      # ==========================================
      # 18. CHECK APK
      # ==========================================
      - name: Check APK
        if: always()
        run: |
          echo "=========================================="
          echo "APK FILES"
          echo "=========================================="

          find . \
            -type f \
            -name "*.apk" \
            -print

          if find bin \
            -type f \
            -name "*.apk" \
            | grep -q .; then

            echo ""
            echo "APK FOUND!"

          else

            echo ""
            echo "No APK was produced."

          fi


      # ==========================================
      # 19. UPLOAD APK
      # ==========================================
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FeeTrack-APK
          path: bin/*.apk
          if-no-files-found: error


      # ==========================================
      # 20. UPLOAD BUILD LOG
      # ==========================================
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FeeTrack-build-log
          path: |
            build.log
            .buildozer/android/platform/python-for-android/*.log
          if-no-files-found: warn
