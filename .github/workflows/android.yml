name: Build FeeTrack Academy

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
      ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.8"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            wget \
            curl \
            unzip \
            zip \
            build-essential \
            autoconf \
            automake \
            autopoint \
            libtool \
            libtool-bin \
            pkg-config \
            cmake \
            libffi-dev \
            libssl-dev \
            libltdl-dev \
            zlib1g-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer
          python -m pip install cython==0.29.37

      - name: Clean Buildozer
        run: |
          rm -rf "$HOME/.buildozer"
          rm -rf .buildozer
          rm -rf bin

          mkdir -p "$HOME/.buildozer/android/platform/android-sdk"

      - name: Install Android Command Line Tools
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK/cmdline-tools"

          cd /tmp

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip

          unzip -q commandlinetools-linux-13114758_latest.zip

          mkdir -p "$SDK/cmdline-tools/latest"

          cp -R cmdline-tools/* "$SDK/cmdline-tools/latest/"

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Verify SDK Manager
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          export PATH="$SDK/cmdline-tools/latest/bin:$PATH"

          echo "SDK = $SDK"

          sdkmanager --version

      - name: Install Android SDK Packages
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          export PATH="$SDK/cmdline-tools/latest/bin:$PATH"

          echo "Installing Android SDK packages..."

          yes | sdkmanager --sdk_root="$SDK" --licenses || true

          sdkmanager --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358"

      - name: Verify Android SDK
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "======================================"
          echo "SDK DIRECTORY"
          echo "======================================"

          ls -la "$SDK"

          echo ""
          echo "======================================"
          echo "BUILD TOOLS"
          echo "======================================"

          ls -la "$SDK/build-tools"

          echo ""
          echo "======================================"
          echo "AIDL"
          echo "======================================"

          ls -lh "$SDK/build-tools/35.0.0/aidl"

          echo ""
          echo "======================================"
          echo "AIDL VERSION"
          echo "======================================"

          "$SDK/build-tools/35.0.0/aidl" --version || true

          echo ""
          echo "======================================"
          echo "PLATFORM"
          echo "======================================"

          ls -la "$SDK/platforms/android-33"

          echo ""
          echo "======================================"
          echo "NDK"
          echo "======================================"

          ls -la "$SDK/ndk/28.2.13676358"

      - name: Configure Android Environment
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Clean Project Build
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK
        env:
          ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
          ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$SDK/build-tools/35.0.0:$PATH"

          echo "======================================"
          echo "FINAL SDK CHECK"
          echo "======================================"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo ""
          echo "AIDL:"
          ls -lh "$SDK/build-tools/35.0.0/aidl"

          echo ""
          echo "BUILDING FEE TRACK ACADEMY..."
          echo ""

          buildozer -v android debug

      - name: Find APK
        if: always()
        run: |
          echo "APK FILES:"
          find . -type f -name "*.apk" -print || true

          echo ""
          echo "BIN:"
          ls -lah bin 2>/dev/null || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FeeTrack-Academy-APK
          path: bin/*.apk
          if-no-files-found: error
