name: Build FeeTrack Academy

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      BUILDOZER_ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
      ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
      ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk

    steps:

      # ============================================
      # CHECKOUT
      # ============================================
      - name: Checkout
        uses: actions/checkout@v4


      # ============================================
      # PYTHON 3.11.8
      # ============================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.8"


      # ============================================
      # JAVA 17
      # ============================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================
      # LINUX DEPENDENCIES
      # ============================================
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            build-essential \
            autoconf \
            automake \
            autopoint \
            libtool \
            libtool-bin \
            pkg-config \
            cmake \
            libffi-dev \
            libssl-dev \
            libltdl-dev \
            zlib1g-dev


      # ============================================
      # PYTHON BUILD TOOLS
      # ============================================
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip

          python -m pip install buildozer

          python -m pip install cython==0.29.37


      # ============================================
      # REMOVE OLD BUILDOZER SDK
      # ============================================
      - name: Clean Buildozer
        run: |
          rm -rf "$HOME/.buildozer"
          rm -rf .buildozer
          rm -rf bin

          mkdir -p "$HOME/.buildozer"


      # ============================================
      # CREATE BUILDOZER SDK DIRECTORY
      # ============================================
      - name: Prepare Buildozer Android SDK
        run: |
          mkdir -p "$HOME/.buildozer/android/platform/android-sdk"

          echo "Buildozer SDK:"
          echo "$HOME/.buildozer/android/platform/android-sdk"


      # ============================================
      # INSTALL ANDROID COMMAND LINE TOOLS
      # ============================================
      - name: Install Android Command Line Tools
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK/cmdline-tools"

          cd /tmp

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip

          unzip -q commandlinetools-linux-13114758_latest.zip

          mkdir -p "$SDK/cmdline-tools/latest"

          cp -R cmdline-tools/* \
            "$SDK/cmdline-tools/latest/"

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/build-tools/35.0.0" >> "$GITHUB_PATH"


      # ============================================
      # INSTALL ANDROID PACKAGES
      # ============================================
      - name: Install Android SDK Packages
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          export PATH="$SDK/cmdline-tools/latest/bin:$PATH"

          sdkmanager --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358"


      # ============================================
      # ACCEPT LICENSES
      # ============================================
      - name: Accept Android Licenses
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          export PATH="$SDK/cmdline-tools/latest/bin:$PATH"

          yes | sdkmanager \
            --sdk_root="$SDK" \
            --licenses || true


      # ============================================
      # VERIFY BUILDOZER SDK
      # ============================================
      - name: Verify Buildozer SDK
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "======================================"
          echo "BUILDOZER SDK"
          echo "======================================"

          echo "$SDK"

          echo ""
          echo "BUILD TOOLS:"
          ls -la "$SDK/build-tools"

          echo ""
          echo "AIDL:"
          ls -lh "$SDK/build-tools/35.0.0/aidl"

          echo ""
          echo "AIDL TEST:"
          "$SDK/build-tools/35.0.0/aidl" --version || true

          echo ""
          echo "PLATFORM:"
          ls -la "$SDK/platforms/android-33"

          echo ""
          echo "NDK:"
          ls -la "$SDK/ndk/28.2.13676358"


      # ============================================
      # VERIFY ENVIRONMENT
      # ============================================
      - name: Verify Environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo ""
          echo "SDKMANAGER:"
          which sdkmanager || true

          echo ""
          echo "AIDL:"
          find "$HOME/.buildozer/android/platform/android-sdk" \
            -type f \
            -name aidl \
            -print


      # ============================================
      # BUILD
      # ============================================
      - name: Build APK
        env:
          ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
          ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$SDK/build-tools/35.0.0:$PATH"

          echo "======================================"
          echo "FINAL AIDL CHECK"
          echo "======================================"

          ls -lh "$SDK/build-tools/35.0.0/aidl"

          echo ""
          echo "======================================"
          echo "STARTING BUILDOZER"
          echo "======================================"

          buildozer -v android debug


      # ============================================
      # FIND APK
      # ============================================
      - name: Find APK
        if: always()
        run: |
          echo "======================================"
          echo "APK SEARCH"
          echo "======================================"

          find . -type f -name "*.apk" -print || true

          echo ""
          echo "BIN:"
          ls -lah bin 2>/dev/null || true


      # ============================================
      # UPLOAD APK
      # ============================================
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FeeTrack-Academy-APK
          path: bin/*.apk
          if-no-files-found: error
