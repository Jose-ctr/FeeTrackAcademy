name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system packages
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip wget curl \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses6 libncurses-dev libtinfo6 \
            libffi-dev libssl-dev libsqlite3-dev \
            build-essential cmake \
            lib32stdc++6 lib32z1

      - name: Download and install Android NDK r28c manually
        run: |
          mkdir -p $HOME/.buildozer/android/platform
          cd /tmp
          wget -q https://dl.google.com/android/repository/android-ndk-r28c-linux-x86_64.zip -O ndk-r28c.zip
          unzip -q ndk-r28c.zip -d $HOME/.buildozer/android/platform
          extracted=$(find $HOME/.buildozer/android/platform -maxdepth 1 -type d -name "android-ndk-*"! -path "$HOME/.buildozer/android/platform" | head -n 1)
          if [ -n "$extracted" ]; then
            mv "$extracted" "$HOME/.buildozer/android/platform/android-ndk-r28c"
          fi
          echo "ANDROID_NDK_HOME=$HOME/.buildozer/android/platform/android-ndk-r28c" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$HOME/.buildozer/android/platform/android-ndk-r28c" >> $GITHUB_ENV
          ls -la $HOME/.buildozer/android/platform

      - name: Install Android SDK command-line tools
        run: |
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q tools.zip
          mv cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest

      - name: Accept Android licenses
        run: |
          mkdir -p $ANDROID_SDK_ROOT/licenses
          echo '24333f8a63b6825ea9c5514f83c2829b004d1fee' > $ANDROID_SDK_ROOT/licenses/android-sdk-license
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          sdkmanager --install \
            'platform-tools' \
            'platforms;android-33' \
            'build-tools;33.0.2'

      - name: Install Python tools + python-for-android
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.3.0 cython==0.29.33
          pip install https://github.com/kivy/python-for-android/archive/stable.zip

      - name: Clean old build
        run: rm -rf $HOME/.buildozer./.buildozer

      - name: Build APK
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          export ANDROID_NDK_HOME="$HOME/.buildozer/android/platform/android-ndk-r28c"
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FeeTrack-APK
          path: bin/*.apk
          retention-days: 7
