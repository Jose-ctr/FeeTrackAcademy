name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip wget curl autoconf automake \
            libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev cmake libffi-dev libssl-dev build-essential

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;34.0.0" \
            "cmdline-tools;latest"

      - name: Verify AIDL exists
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          find $ANDROID_SDK_ROOT -name aidl | head

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer==1.5.0 cython==0.29.36 virtualenv

      # CRITICAL FIX
      - name: Force Buildozer to use GitHub SDK
        run: |
          mkdir -p ~/.buildozer
          echo "export ANDROIDSDK=$ANDROID_SDK_ROOT" >> ~/.profile
          echo "export ANDROID_HOME=$ANDROID_SDK_ROOT" >> ~/.profile
          echo "export ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> ~/.profile

      - name: Remove old Buildozer SDK/cache
        run: |
          rm -rf ~/.buildozer/android
          rm -rf .buildozer

      - name: Build APK
        env:
          ANDROIDSDK: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          buildozer -v android debug

      - name: Find APK files
        if: always()
        run: |
          echo "Searching for APK files..."
          find . -name "*.apk" | sort || true

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FeeTrack-debug-apk
          path: |
            bin/*.apk
            .buildozer/android/platform/build-*/dists/*/build/outputs/apk/debug/*.apk
          if-no-files-found: error
