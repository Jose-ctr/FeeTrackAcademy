name: Build FeeTrack Kivy APK
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_NDK_VERSION: 21.4.7075529
      ANDROID_NDK_HOME: ${{ github.workspace }}/android-sdk/ndk/21.4.7075529

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo dpkg --add-architecture i386 || true
          sudo apt-get update
          sudo apt-get install -y curl wget unzip zip tar gzip ant lib32z1 lib32stdc++6 libffi-dev build-essential libc6:i386 libncurses5:i386 libssl-dev

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Export NDK path for Buildozer
        run: echo "ANDROIDNDKHOME=$ANDROID_NDK_HOME" >> $GITHUB_ENV

      - name: Install pip packages
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer cython==0.29.33

      - name: Install Android SDK + NDK
        run: |
          set -eux
          mkdir -p "$ANDROID_SDK_ROOT"
          cd /tmp
          curl -fLo commandlinetools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q commandlinetools.zip -d cmdline-tools-temp
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          mv cmdline-tools-temp/cmdline-tools/* "$ANDROID_SDK_ROOT/cmdline-tools/latest/"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-31" "build-tools;31.0.0" "ndk;${ANDROID_NDK_VERSION}"

      - name: Clean previous buildozer state
        run: rm -rf ~/.buildozer || true

      - name: Build APK with Buildozer
        run: buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FeeTrack-APK
          path: bin/*.apk
