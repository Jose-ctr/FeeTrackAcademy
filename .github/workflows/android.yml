name: Build FeeTrack Kivy APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5 libffi-dev
    
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 31
        build-tools-version: '34.0.0'
    
    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Install Buildozer + Cython
      run: pip install buildozer==1.5.0 cython==0.29.33
    
    - name: Install Android deps + Accept Licenses
      run: |
        yes | sdkmanager --install "platform-tools" "platforms;android-31" "build-tools;34.0.0"
        yes | sdkmanager --licenses
      env:
        ANDROID_SDK_ROOT: /opt/android-sdk
        ANDROID_HOME: /opt/android-sdk
    
    - name: Build APK with Buildozer
      run: buildozer -v android debug
      env:
        ANDROID_SDK_ROOT: /opt/android-sdk
        ANDROID_HOME: /opt/android-sdk
    
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FeeTrack-APK
        path: bin/*.apk
