name: Build FeeTrack APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip wget
          pip install "buildozer==1.3.0" cython

      - name: Install Android SDK + Accept Licenses (verbose)
        shell: bash
        run: |
          set -euo pipefail
          set -x

          mkdir -p "$ANDROID_SDK_ROOT"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"

          cd /tmp
          wget --tries=3 --timeout=60 https://dl.google.com/android/repository/commandlinetools-linux-latest.zip -O cmdtools.zip
          unzip cmdtools.zip
          mv cmdline-tools "$ANDROID_SDK_ROOT/cmdline-tools/latest"

          export PATH="$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin"
          export ANDROID_SDK_ROOT="$ANDROID_SDK_ROOT"
          
          java -version
          sdkmanager --version
          
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;21.4.7075529"

          ls -R "$ANDROID_SDK_ROOT" | sed -n '1,200p'

      - name: Build APK (verbose)
        shell: bash
        run: |
          set -euo pipefail
          set -x
          export PATH="$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools"
          echo "JAVA_HOME=$JAVA_HOME"
          echo "PATH=$PATH"
          java -version
          sdkmanager --version || true
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FeeTrack-APK
          path: bin/*.apk
