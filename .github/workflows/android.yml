name: Build Android APK

on:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-22.04
timeout-minutes: 90

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: '3.10'

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: 'temurin'
      java-version: '17'

  - name: Install system dependencies
    run: |
      sudo apt-get update
      sudo apt-get install -y \
        git zip unzip autoconf libtool pkg-config \
        zlib1g-dev libncurses5-dev libncursesw5-dev \
        cmake libffi-dev libssl-dev

  - name: Install Buildozer
    run: |
      python -m pip install --upgrade pip
      pip install buildozer==1.5.0 cython==0.29.33 virtualenv

  - name: Build APK
    run: |
      buildozer android debug 2>&1 | tee buildozer-output.txt

  - name: Show build files
    if: always()
    run: |
      echo "=== bin directory ==="
      ls -lah bin || true
      echo "=== project root ==="
      ls -lah

  - name: Upload APK
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: FeeTrack-APK
      path: |
        bin/*.apk
        .buildozer/android/platform/build-*/dists/*/build/outputs/apk/debug/*.apk
      if-no-files-found: warn

  - name: Upload Buildozer Log
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: buildozer-log
      path: buildozer-output.txt
