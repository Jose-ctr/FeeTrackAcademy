name: Build Android APK

on:
  workflow_dispatch:
  # Optional: enable on push to branches/tags
  # push:
  #   branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      ANDROID_HOME: ${{ github.workspace }}/android-sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python (with pip cache)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl wget git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev \
            libssl-dev build-essential python3-pip python3-setuptools \
            libgl1-mesa-dev

      - name: Cache Buildozer directories
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.cache/pip
          key: ${{ runner.os }}-buildozer-${{ hashFiles('**/buildozer.spec') }}

      - name: Configure Android SDK variables and PATH
        run: |
          mkdir -p "$ANDROID_SDK_ROOT"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH

      - name: Install Android commandline tools and SDK packages
        env:
          ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
        run: |
          set -euo pipefail
          cd "$ANDROID_SDK_ROOT"
          CLI_ZIP=commandlinetools-linux-9477386_latest.zip
          wget -q https://dl.google.com/android/repository/$CLI_ZIP
          mkdir -p cmdline-tools
          unzip -q -o $CLI_ZIP -d cmdline-tools/tmp
          mv cmdline-tools/tmp/cmdline-tools cmdline-tools/latest
          rm -rf cmdline-tools/tmp

          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" --licenses
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "ndk;23.1.7779620" \
            "cmake;3.22.1"

      - name: Install Buildozer and Python deps
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer==1.5.0 cython==0.29.33 virtualenv

      - name: Check buildozer.spec exists
        run: |
          if [ ! -f buildozer.spec ]; then
            echo "::error::buildozer.spec not found in repo root. Please commit it."
            ls -la
            exit 1
          fi
          echo "Found buildozer.spec"

      - name: Build APK (non-interactive)
        env:
          ANDROIDSDK: ${{ github.workspace }}/android-sdk
          ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
          ANDROID_HOME: ${{ github.workspace }}/android-sdk
        run: |
          set -o pipefail
          buildozer android clean || true
          yes | buildozer -v android debug 2>&1 | tee buildozer-output.txt

      - name: Show build files
        if: always()
        run: |
          echo "=== bin directory ==="
          ls -lah bin || true
          echo "=== .buildozer directory ==="
          ls -lah .buildozer || true
          echo "=== dist directory (possible places for APK) ==="
          ls -lah dist || true
          echo "=== find any apk files ==="
          find . -type f -name "*.apk" -ls || true

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FeeTrack-APK
          path: |
            bin/*.apk
            ./.buildozer/android/platform/build/dists/**/*.apk
            dist/*.apk
            **/*.apk
          if-no-files-found: warn

      - name: Upload Buildozer Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: buildozer-output.txt
