name: Build FeeTrack APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      ANDROID_HOME: ${{ github.workspace }}/android-sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            build-essential \
            libssl-dev \
            zlib1g-dev \
            libncurses6 \
            libncurses-dev \
            libtinfo6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-33"
          sdkmanager "build-tools;34.0.0"
          sdkmanager "ndk;28.0.13004108"

      - name: Verify Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"

          echo "===== BUILD TOOLS ====="
          ls -la "$ANDROID_SDK_ROOT/build-tools"

          echo "===== AIDL ====="
          ls -la "$ANDROID_SDK_ROOT/build-tools/34.0.0/aidl"

          echo "===== NDK ====="
          ls -la "$ANDROID_SDK_ROOT/ndk/28.0.13004108"

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade buildozer cython==0.29.37

      - name: Clear previous Buildozer cache
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROIDSDK: ${{ env.ANDROID_SDK_ROOT }}

          ANDROIDNDK: ${{ env.ANDROID_SDK_ROOT }}/ndk/28.0.13004108
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/28.0.13004108
          ANDROID_NDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}/ndk/28.0.13004108

          P4A_SDK_DIR: ${{ env.ANDROID_SDK_ROOT }}
          P4A_NDK_DIR: ${{ env.ANDROID_SDK_ROOT }}/ndk/28.0.13004108

        run: |
          echo "===== BUILD ENVIRONMENT ====="
          echo "SDK: $ANDROID_SDK_ROOT"
          echo "NDK: $ANDROID_NDK_HOME"

          echo "===== BUILD TOOLS ====="
          ls -la "$ANDROID_SDK_ROOT/build-tools"

          echo "===== AIDL ====="
          find "$ANDROID_SDK_ROOT/build-tools" -name aidl -type f -print

          echo "===== BUILD APK ====="
          buildozer -v android debug \
            --storage-dir=.buildozer

      - name: Check APK
        run: |
          echo "===== APK FILES ====="
          find . -type f -name "*.apk" -print

          if ! find bin -type f -name "*.apk" | grep -q .; then
            echo "ERROR: No APK was produced."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FeeTrack-APK
          path: bin/*.apk
          if-no-files-found: error
