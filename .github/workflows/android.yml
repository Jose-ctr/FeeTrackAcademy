name: Build FeeTrack Kivy APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04  # <- IMPORTANT: 20.04 is dead

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5
    
    - name: Install Buildozer
      run: pip install buildozer==1.5.0 cython==0.29.33
    
    - name: Accept licenses
      run: yes | sdkmanager --licenses || true
    
    - name: Build with Buildozer
      run: buildozer -v android debug
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: FeeTrack-APK
        path: bin/*.apk
