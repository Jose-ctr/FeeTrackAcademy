name: Build FeeTrack Academy

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.8"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            libffi-dev \
            libssl-dev \
            libltdl-dev \
            zlib1g-dev

      - name: Install Android SDK command line tools
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"

          cd /tmp

          wget -q https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip

          unzip -q commandlinetools-linux-13114758_latest.zip

          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"

          cp -R cmdline-tools/* "$ANDROID_HOME/cmdline-tools/latest/"

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Check SDK manager
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sdkmanager --version

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358"

      - name: VERIFY AIDL
        run: |
          echo "======================================"
          echo "ANDROID SDK"
          echo "======================================"
          echo "$ANDROID_HOME"

          echo "======================================"
          echo "BUILD TOOLS"
          echo "======================================"
          ls -la "$ANDROID_HOME/build-tools/"

          echo "======================================"
          echo "AIDL FILE"
          echo "======================================"
          ls -la "$ANDROID_HOME/build-tools/35.0.0/aidl"

          echo "======================================"
          echo "AIDL VERSION"
          echo "======================================"
          "$ANDROID_HOME/build-tools/35.0.0/aidl" || true

          echo "======================================"
          echo "SEARCHING FOR ALL AIDL FILES"
          echo "======================================"
          find "$ANDROID_HOME" -type f -name aidl -print

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer
          python -m pip install cython==0.29.37

      - name: Configure Buildozer Android paths
        run: |
          mkdir -p ~/.buildozer

          cat > ~/.buildozer/config.ini <<EOF
          [buildozer]
          log_level = 2
          warn_on_root = 0
          EOF

      - name: Clean previous build
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Find APK
        run: |
          echo "APK files:"
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FeeTrack-Academy-APK
          path: bin/*.apk
          if-no-files-found: error
