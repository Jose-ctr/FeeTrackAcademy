name: Android Build
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    name: Build Android APK (Buildozer)
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      ANDROID_SDK_ROOT: /home/runner/android-sdk
      ANDROID_HOME: /home/runner/android-sdk
      ANDROID_SDK_MANAGER: /home/runner/android-sdk/cmdline-tools/latest/bin/sdkmanager
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with: {python-version: '3.11.15'}
    - uses: actions/setup-java@v4
      with: {distribution: 'temurin', java-version: '17'}
    - name: Install system packages
      run: sudo apt-get update && sudo apt-get install -y unzip wget zip libncurses5 libstdc++6 autoconf libtool pkg-config zlib1g-dev libncursesw5-dev cmake libffi-dev libssl-dev build-essential libgl1-mesa-dev libsqlite3-dev libbz2-dev libreadline-dev liblzma-dev tk-dev
    - name: Install Android SDK + NDK commandline tools
      run: |
        mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
        cd $ANDROID_SDK_ROOT
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
        unzip -q cmdline-tools.zip -d cmdline-tools-temp
        mkdir -p cmdline-tools/latest
        mv cmdline-tools-temp/cmdline-tools/* cmdline-tools/latest/
        echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
    - name: Accept licenses and install packages
      run: |
        yes | sdkmanager --licenses || true
        sdkmanager "platform-tools" "platforms;android-33" "build-tools;37.0.0" "ndk;28.0.12674087"
    - name: Set NDK env after install
      run: |
        NDK_PATH=$(ls $ANDROID_SDK_ROOT/ndk)
        echo "Found NDK folder: $NDK_PATH"
        echo ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK_PATH >> $GITHUB_ENV
        echo ANDROIDNDK=$ANDROID_SDK_ROOT/ndk/$NDK_PATH >> $GITHUB_ENV
        echo ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/$NDK_PATH >> $GITHUB_ENV
        ls -la $ANDROID_SDK_ROOT/ndk/$NDK_PATH
    - name: Cache Buildozer
      uses: actions/cache@v4
      with: {path: ~/.buildozer, key: buildozer-py311-v20-${{ hashFiles('buildozer.spec') }}}
    - name: Install Buildozer
      run: pip install --upgrade pip setuptools wheel && pip install buildozer==1.5.0 cython==0.29.33 virtualenv
    - name: Build APK
      run: buildozer android clean || true && buildozer -v android debug
    - uses: actions/upload-artifact@v4
      if: always()
      with: {name: FeeTrackAPK, path: bin/*}
