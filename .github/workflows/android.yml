name: Build FeeTrack APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      ANDROID_HOME: ${{ github.workspace }}/android-sdk

    steps:

      # --------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------
      # PYTHON
      # --------------------------------------------------
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # --------------------------------------------------
      # JAVA
      # --------------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # --------------------------------------------------
      # SYSTEM DEPENDENCIES
      # --------------------------------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            build-essential \
            libssl-dev \
            zlib1g-dev \
            libncurses6 \
            libncurses-dev \
            libtinfo6


      # --------------------------------------------------
      # ANDROID SDK
      # --------------------------------------------------
      - name: Install Android command line tools
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"

          cd "$ANDROID_SDK_ROOT"

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip \
            -O commandlinetools.zip

          unzip -q commandlinetools.zip

          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"

          mv cmdline-tools/* \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/"

          rm -rf cmdline-tools.zip

          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/build-tools/34.0.0" >> "$GITHUB_PATH"


      # --------------------------------------------------
      # VERIFY SDKMANAGER
      # --------------------------------------------------
      - name: Verify sdkmanager
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          which sdkmanager

          sdkmanager --version


      # --------------------------------------------------
      # ACCEPT ANDROID LICENSES
      # --------------------------------------------------
      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses || true


      # --------------------------------------------------
      # INSTALL ANDROID PACKAGES
      # --------------------------------------------------
      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;34.0.0"

          yes | sdkmanager --licenses || true


      # --------------------------------------------------
      # VERIFY ANDROID BUILD TOOLS
      # --------------------------------------------------
      - name: Verify Android Build Tools
        run: |
          echo "===== SDK ====="
          ls -la "$ANDROID_SDK_ROOT"

          echo "===== BUILD TOOLS ====="
          ls -la "$ANDROID_SDK_ROOT/build-tools"

          echo "===== AIDL ====="
          ls -la "$ANDROID_SDK_ROOT/build-tools/34.0.0/aidl"

          echo "===== SDKMANAGER ====="
          which sdkmanager
          sdkmanager --version


      # --------------------------------------------------
      # BUILDOZER
      # --------------------------------------------------
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip

          python -m pip install \
            buildozer \
            "cython==0.29.37"


      # --------------------------------------------------
      # CLEAR OLD BUILD FILES
      # --------------------------------------------------
      - name: Clear Buildozer cache
        run: |
          rm -rf .buildozer
          rm -rf bin


      # --------------------------------------------------
      # BUILD APK
      # --------------------------------------------------
      - name: Build APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROIDSDK: ${{ env.ANDROID_SDK_ROOT }}

          P4A_SDK_DIR: ${{ env.ANDROID_SDK_ROOT }}

        run: |
          echo "===== BUILD ENVIRONMENT ====="

          echo "Python:"
          python --version

          echo "Java:"
          java -version

          echo "SDK:"
          echo "$ANDROID_SDK_ROOT"

          echo "sdkmanager:"
          which sdkmanager

          echo "Build Tools:"
          ls -la "$ANDROID_SDK_ROOT/build-tools"

          echo "Starting Buildozer..."

          buildozer -v android debug \
            --storage-dir=.buildozer


      # --------------------------------------------------
      # CHECK APK
      # --------------------------------------------------
      - name: Check APK
        run: |
          echo "===== GENERATED APK FILES ====="

          find . -type f -name "*.apk" -print

          if ! find bin -type f -name "*.apk" | grep -q .; then
            echo ""
            echo "ERROR: No APK was produced."
            echo ""
            exit 1
          fi


      # --------------------------------------------------
      # UPLOAD APK
      # --------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FeeTrack-APK
          path: bin/*.apk
          if-no-files-found: error
