name: Build FeeTrack Kivy APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 31
        target: default
        build-tools-version: '34.0.0'
        ndk: 25b

    - name: Install Android SDK components
      run: |
        export ANDROID_SDK_ROOT=/opt/android-sdk
        export ANDROID_HOME=/opt/android-sdk
        export PATH=/opt/android-sdk/cmdline-tools/latest/bin:/opt/android-sdk/platform-tools:$PATH
        sdkmanager --list || true
        yes | sdkmanager "platform-tools" "platforms;android-31" "build-tools;34.0.0"

    - name: Accept Android SDK licenses
      run: |
        export ANDROID_SDK_ROOT=/opt/android-sdk
        export ANDROID_HOME=/opt/android-sdk
        export PATH=/opt/android-sdk/cmdline-tools/latest/bin:/opt/android-sdk/platform-tools:$PATH
        yes | sdkmanager --licenses

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5 libffi-dev

    - name: Install Buildozer + Cython
      run: pip install buildozer==1.5.0 cython==0.29.33

    - name: Build APK with Buildozer
      run: |
        export ANDROID_SDK_ROOT=/opt/android-sdk
        export ANDROID_HOME=/opt/android-sdk
        export BUILDOZER_ANDROID_SDK_ROOT=/opt/android-sdk
        export BUILDOZER_ANDROID_NDK_ROOT=/opt/android-sdk/ndk/25b
        export PATH=/opt/android-sdk/cmdline-tools/latest/bin:/opt/android-sdk/platform-tools:$PATH
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FeeTrack-APK
        path: bin/*.apk
        if-no-files-found: error
