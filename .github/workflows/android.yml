name: Build FeeTrack APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            build-essential \
            libssl-dev \
            zlib1g-dev \
            libncurses6 \
            libncurses-dev \
            libtinfo6

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer
          python -m pip install "cython==0.29.37"

      - name: Clear old Buildozer files
        run: |
          rm -rf .buildozer
          rm -rf ~/.buildozer
          rm -rf bin

      - name: Prepare Buildozer Android SDK
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          rm -rf "$SDK"

          mkdir -p "$SDK/cmdline-tools"

          cd "$SDK"

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip \
            -O commandlinetools.zip

          mkdir -p "$SDK/cmdline-tools/temp"

          unzip -q \
            commandlinetools.zip \
            -d "$SDK/cmdline-tools/temp"

          mkdir -p "$SDK/cmdline-tools/latest"

          mv \
            "$SDK/cmdline-tools/temp/cmdline-tools/"* \
            "$SDK/cmdline-tools/latest/"

          rm -rf "$SDK/cmdline-tools/temp"
          rm -f "$SDK/commandlinetools.zip"

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          echo "SDK=$SDK"

          echo "===== SDKMANAGER ====="

          "$SDK/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Accept Android licenses
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          export PATH="$SDK/cmdline-tools/latest/bin:$PATH"

          yes | sdkmanager --licenses || true

      - name: Install Android SDK
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          export PATH="$SDK/cmdline-tools/latest/bin:$PATH"

          sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;34.0.0"

          yes | sdkmanager --licenses || true

      - name: Install Android NDK
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          export PATH="$SDK/cmdline-tools/latest/bin:$PATH"

          sdkmanager "ndk;28.0.13004108"

      - name: Verify AIDL
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "===== BUILD TOOLS ====="

          ls -la "$SDK/build-tools"

          echo "===== AIDL ====="

          ls -la "$SDK/build-tools/34.0.0/aidl"

          echo "===== FIND AIDL ====="

          find "$SDK" -type f -name aidl -print

      - name: Build APK
        env:
          ANDROID_HOME: ${{ env.HOME }}/.buildozer/android/platform/android-sdk
          ANDROID_SDK_ROOT: ${{ env.HOME }}/.buildozer/android/platform/android-sdk
          ANDROIDSDK: ${{ env.HOME }}/.buildozer/android/platform/android-sdk

          ANDROIDNDK: ${{ env.HOME }}/.buildozer/android/platform/android-sdk/ndk/28.0.13004108
          ANDROID_NDK_HOME: ${{ env.HOME }}/.buildozer/android/platform/android-sdk/ndk/28.0.13004108
          ANDROID_NDK_ROOT: ${{ env.HOME }}/.buildozer/android/platform/android-sdk/ndk/28.0.13004108

          P4A_SDK_DIR: ${{ env.HOME }}/.buildozer/android/platform/android-sdk
          P4A_NDK_DIR: ${{ env.HOME }}/.buildozer/android/platform/android-sdk/ndk/28.0.13004108

        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          export PATH="$SDK/cmdline-tools/latest/bin:$PATH"

          echo "================================"
          echo "ANDROID SDK"
          echo "================================"

          echo "$SDK"

          echo "================================"
          echo "SDKMANAGER"
          echo "================================"

          which sdkmanager
          sdkmanager --version

          echo "================================"
          echo "AIDL"
          echo "================================"

          find "$SDK/build-tools" \
            -type f \
            -name aidl \
            -print

          echo "================================"
          echo "BUILD APK"
          echo "================================"

          buildozer -v android debug \
            --storage-dir=.buildozer

      - name: Check APK
        run: |
          echo "===== APK FILES ====="

          find . \
            -type f \
            -name "*.apk" \
            -print

          if ! find bin \
            -type f \
            -name "*.apk" \
            | grep -q .; then

            echo "ERROR: APK was not produced."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FeeTrack-APK
          path: bin/*.apk
          if-no-files-found: error
