name: Build FeeTrack APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip wget curl \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses6 libncurses-dev libtinfo6 \
            cmake libffi-dev libssl-dev build-essential

      - name: Install Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-33
            build-tools;34.0.0
            ndk;28.0.13004108

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses

      - name: Set Android environment
        run: |
          echo "ANDROIDSDK=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROIDNDK=$ANDROID_SDK_ROOT/ndk/28.0.13004108" >> $GITHUB_ENV
          echo "P4A_SDK_DIR=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "P4A_NDK_DIR=$ANDROID_SDK_ROOT/ndk/28.0.13004108" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Verify aidl exists
        run: |
          ls -R $ANDROID_SDK_ROOT/build-tools
          find $ANDROID_SDK_ROOT -name aidl

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install Cython==0.29.36 buildozer==1.5.0

      - name: Clean caches
        run: |
          rm -rf .buildozer
          rm -rf ~/.buildozer
          rm -rf ~/.gradle
          rm -rf ~/.android

      - name: Build APK
        env:
          ANDROIDNDK: ${{ env.ANDROIDNDK }}
          ANDROIDSDK: ${{ env.ANDROIDSDK }}
          P4A_SDK_DIR: ${{ env.P4A_SDK_DIR }}
          P4A_NDK_DIR: ${{ env.P4A_NDK_DIR }}
          ANDROIDAPI: 33
          ANDROIDMINAPI: 24
        run: |
          buildozer -v android debug --storage-dir=.buildozer

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FeeTrack-debug-apk
          path: bin/*.apk
          
