name: Android Build
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Java 17 for SDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android commandline tools, platform and build-tools (API 34)
        run: |
          # Ensure ANDROID_SDK_ROOT points to the SDK installation
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          # Install/ensure cmdline-tools are available, accept licenses, then install platform & build-tools
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "cmdline-tools;latest" || true
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Install NDK
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME set to $ANDROID_NDK_HOME"

      - name: Java 8 for p4a
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install p4a
        run: |
          python -m pip install --upgrade pip
          python -m pip install git+https://github.com/kivy/python-for-android.git@stable cython==0.29.33

      - name: Build APK
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT || env.ANDROID_HOME }}
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "Using ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          # Use API 34 explicitly to avoid defaulting to API 15 (which isn't installed)
          python -m pythonforandroid.toolchain apk --android-api=34 --spec=buildozer.spec --storage-dir=/tmp/p4a_build --ndk-dir="$ANDROID_NDK_HOME"
          cd /tmp/p4a_build/dists/feetrack && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: FeeTrackAPK
          path: /tmp/p4a_build/dists/feetrack/app/build/outputs/apk/debug/*.apk
