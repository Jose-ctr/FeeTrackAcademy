name: Build FeeTrack APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            build-essential \
            libssl-dev \
            zlib1g-dev \
            libncurses6 \
            libncurses-dev \
            libtinfo6

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade buildozer
          python -m pip install "cython==0.29.37"

      - name: Clear Buildozer cache
        run: |
          rm -rf ~/.buildozer
          rm -rf .buildozer
          rm -rf bin

      - name: Prepare Android SDK
        run: |
          mkdir -p "$HOME/.buildozer/android/platform/android-sdk"

          export ANDROID_SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          ANDROID_ACCEPT_SDK_LICENSE: "1"
          P4A_ACCEPT_ANDROID_SDK_LICENSE: "1"
        run: |
          yes | buildozer -v android debug \
            --storage-dir=.buildozer

      - name: Check APK
        run: |
          echo "===== APK FILES ====="
          find . -type f -name "*.apk" -print

          if ! find bin -type f -name "*.apk" | grep -q .; then
            echo "ERROR: No APK was produced."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FeeTrack-APK
          path: bin/*.apk
          if-no-files-found: error
