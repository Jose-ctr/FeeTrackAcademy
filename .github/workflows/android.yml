name: Build FeeTrack Kivy APK
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      ANDROID_NDK_HOME: ${{ github.workspace }}/android-sdk/ndk/21.4.7075529
      
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.9'
          
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.33
          
      - name: Install Android SDK + NDK 21.4.7075529
        run: |
          sudo apt-get update
          sudo apt-get install -y ant wget unzip zip lib32z1 lib32stdc++6 libffi-dev
          
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          cd /tmp
          wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip commandlinetools-linux-11076708_latest.zip -d cmdline-tools-temp
          mv cmdline-tools-temp/cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest
          
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-31" "build-tools;31.0.0" "ndk;21.4.7075529"
          
          echo "NDK installed at:"
          ls $ANDROID_SDK_ROOT/ndk/
          
      - name: Clean and Build
        run: |
          rm -rf ~/.buildozer
          buildozer android debug
          
      - uses: actions/upload-artifact@v4
        with:
          name: FeeTrack-APK
          path: bin/*.apk
