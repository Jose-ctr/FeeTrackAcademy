name: Android Build
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip curl autoconf automake libtool pkg-config zlib1g-dev libncurses6 libncurses-dev libtinfo6 libffi-dev libssl-dev libsqlite3-dev build-essential cmake

      - name: Download Android NDK r27c
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.buildozer/android/platform"
          cd /tmp
          curl -fSL --retry 3 --retry-delay 5 -o ndk.zip "https://dl.google.com/android/repository/android-ndk-r27c-linux.zip"
          unzip -q ndk.zip -d "$HOME/.buildozer/android/platform"
          echo "ANDROID_NDK_HOME=$HOME/.buildozer/android/platform/android-ndk-r27c" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$HOME/.buildozer/android/platform/android-ndk-r27c" >> $GITHUB_ENV

      - name: Install Android SDK command-line tools
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="$HOME/Android/Sdk"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          cd /tmp
          curl -fSL --retry 3 --retry-delay 5 -o tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -o tools.zip
          rm -rf "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          mv cmdline-tools "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          ls -la "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

      - name: Accept Android licenses
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          mkdir -p "$ANDROID_SDK_ROOT/licenses"
          yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          sdkmanager --install 'platform-tools' 'platforms;android-33' 'build-tools;33.0.2'

      - name: Install Python tools
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.3.0 cython==0.29.33
          pip install https://github.com/kivy/python-for-android/archive/stable.zip

      - name: Clean old build
        run: rm -rf "$HOME/.buildozer"

      - name: Build APK
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          buildozer android debug

      - uses: actions/upload-artifact@v4
        with:
          name: FeeTrack-APK
          path: bin/*.apk
          retention-days: 7
