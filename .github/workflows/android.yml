name: Android Build

on:
  push:
  pull step to_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up J install Java DK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK17 (so sdk
        uses: android-actions/setup-android@v3
        with:
          api-level: 33
          build-tools: "33.0.2"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager runs successfully).
manager --licenses

      - name: Build (Gradle)
        run: ./gradlew assembleDebug
